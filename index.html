<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoxCraft</title>
<meta name="description" content="RoxCraft — aplicaciones Android.">
<style>
  :root {
    --ink: #1c2321;
    --ink-soft: #4a5450;
    --paper: #fbfaf7;
    --line: #dedad2;
    --accent: #2f6f5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    line-height: 1.65;
  }
  .wrap {
    max-width: 560px;
    padding: 48px 24px;
    text-align: center;
  }
  .eyebrow {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 12px;
  }
  h1 {
    font-size: 40px;
    margin: 0 0 12px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }
  p { font-size: 17px; color: var(--ink-soft); margin: 0 0 32px; }
  .apps {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 24px 0;
    margin-bottom: 32px;
  }
  .app-name {
    font-size: 19px;
    margin: 0 0 4px;
  }
  .app-desc {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }
  .links {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">RoxCraft</p>
    <h1>Aplicaciones Android</h1>
    <p>Utilidades sencillas, cuidadas y sin complicaciones.</p>

    <div class="apps">
      <p class="app-name">Nexo Sleep Timer</p>
      <p class="app-desc">Detén la reproducción y apaga la pantalla cuando te duermas.</p>
    </div>

    <p class="links">
      <a href="/privacy-policy.html">Política de Privacidad</a>
    </p>
  </div>
</body>
</html>
